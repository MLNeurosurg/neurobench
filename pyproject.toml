[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-bench"
version = "1.0.0"
description = "Evaluation tools for the NeuroBench neuroradiology benchmark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "matplotlib>=3.6,<4", "huggingface-hub>=0.27,<2", "tqdm>=4.66,<5", "scikit-learn>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
neurobench = "neurobench.cli:main"

[project.urls]
Repository = "https://github.com/MLNeurosurg/neurobench"
Dataset = "https://huggingface.co/datasets/mlinslab/neurobench"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["neurobench*"]
namespaces = false

[tool.setuptools.package-data]
"neurobench.llm" = ["default_config.json"]
"neurobench.evaluation.report_generation" = ["prompts/*.txt"]
"neurobench.evaluation.red_team.fabrication_resistance" = ["prompts/*.txt"]
"neurobench.evaluation.red_team.misdiagnosis_resistance" = ["prompts/*.txt"]
"neurobench.evaluation.red_team.mislocalization_resistance" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
